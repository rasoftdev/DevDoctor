<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevDoctor</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
:root{--bg:#0b0f14;--panel:#121820;--panel2:#18202a;--line:#243040;--text:#e8eef5;--mut:#8d9aab;--acc:#3fb8af;--acc-ink:#04201e;
--crit:#ff5d5d;--warn:#f0a91c;--info:#4da3ff;--ok:#3ecf6e;--r:14px;--shadow:0 1px 0 #ffffff08 inset,0 8px 24px #00000040}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f8;--panel:#fff;--panel2:#f0f3f7;--line:#dde3ea;--text:#18212b;--mut:#5d6b7a;--acc:#0e8a82;--acc-ink:#fff;
--crit:#d92d3a;--warn:#b57600;--info:#1a64d6;--ok:#1b8a46;--shadow:0 1px 2px #1b2a3a14,0 6px 18px #1b2a3a10}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.hidden{display:none!important}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:15px;height:15px}

/* controls */
button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:border-color .15s,background .15s}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.6;cursor:progress}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.ghost{background:transparent}
label{display:grid;gap:9px;font-size:13px;font-weight:600;line-height:1.3}
input{font:inherit;font-weight:400;width:100%;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.pw{position:relative}.pw input{padding-right:44px}
.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:7px;border:0;background:transparent;color:var(--mut);border-radius:8px}
.pw .eye:hover{color:var(--text)}
.err{color:var(--crit);min-height:1.3em;font-size:13px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lang button{border:0;border-radius:0;background:transparent;padding:7px 11px;font-size:12px;font-weight:700;color:var(--mut)}
.lang button.on{background:var(--acc);color:var(--acc-ink)}

/* layout */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
h2{font-size:12px;margin:0 0 14px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;font-weight:700;display:flex;align-items:center;gap:8px}
.auth{min-height:100vh;display:grid;place-items:center;padding:16px;position:relative}
.auth .card{width:100%;max-width:400px;display:grid;gap:18px;padding:28px}
.auth .tl{position:absolute;top:16px;right:16px}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px}
.brand b{color:var(--acc)}
.logo-img{width:min(230px,70%);height:auto;display:block;margin:0 auto -4px}
.nav-ico{width:36px;height:36px;display:block}
header{display:flex;gap:10px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);z-index:5}
header .sp{flex:1}
main{padding:22px 24px 48px;max-width:1320px;margin:0 auto;display:grid;gap:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid.kpis{grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
@media(max-width:1100px){.grid.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid.kpis{grid-template-columns:1fr}}
.stack{display:grid;gap:14px}
.muted{color:var(--mut)}

/* health card */
.health{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.ring{width:112px;height:112px;flex:none}.ring text{fill:var(--text);font-weight:800;font-size:26px}
.health .body{flex:1;min-width:260px;display:grid;gap:12px}
.health h1{font-size:18px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--text)}
.tag svg{color:var(--mut)}
.tag.mono{font-size:12px}

/* pulsing dots (replace colored borders) */
.dot{--c:var(--mut);width:9px;height:9px;border-radius:50%;background:var(--c);position:relative;flex:none;display:inline-block}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:pulse 1.8s ease-out infinite}
.dot.crit{--c:var(--crit)}.dot.crit::after{animation-duration:1.2s}
.dot.warn{--c:var(--warn)}.dot.warn::after{animation-duration:1.9s}
.dot.info{--c:var(--info)}.dot.info::after{animation-duration:2.8s}
.dot.ok{--c:var(--ok)}.dot.ok::after{animation:none}
.dot.mut::after{animation:none}
@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(3);opacity:0}}
@media (prefers-reduced-motion:reduce){.dot::after{animation:none!important}}
.crit{color:var(--crit)}.warn{color:var(--warn)}.info{color:var(--info)}.ok{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:9px;padding:5px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,currentColor 10%,transparent)}
.pill .dot{width:8px;height:8px}

/* KPI */
.kpi{display:grid;gap:4px;align-content:start}
.kpi .hd{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.kpi .v{font-size:clamp(20px,2vw,27px);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:12px;color:var(--mut)}
.stats b{color:var(--text);font-variant-numeric:tabular-nums;font-weight:700}
.kpi .s{white-space:normal}
.spark{width:100%;height:44px;margin-top:6px;display:block}

/* disks */
.disks{display:grid;grid-template-columns:repeat(var(--dcols,3),minmax(0,1fr));gap:12px}
@media(max-width:1100px){.disks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.disks{grid-template-columns:1fr}}
.acc{padding:0}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;user-select:none}
.acc summary::-webkit-details-marker{display:none}
.acc-t{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.psum{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;justify-content:flex-end}
.psum .tag{padding:3px 10px;font-size:12px}.psum .tag b{font-variant-numeric:tabular-nums}
.acc .chev{color:var(--mut);transition:transform .2s}
.acc[open] .chev{transform:rotate(180deg)}
.acc[open] .psum{visibility:hidden}
.acc .procs{padding:0 18px 18px}
.acc summary:hover .chev{color:var(--text)}
.disk{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:16px;min-width:0}
.disk svg{width:72px;height:72px;flex:none}.disk text{fill:var(--text);font-weight:800;font-size:19px}
.disk .dt{min-width:0;display:grid;gap:3px}
.disk .m{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.disk .u{font-size:12px;color:var(--mut)}

/* processes */
.procs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(430px,100%),1fr));gap:10px}
.proc{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:15px}
.proc .nm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.proc .nm b{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.proc .mini{font-size:11px;color:var(--mut);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 6px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.meter{display:grid;gap:3px;font-size:11.5px;color:var(--mut)}
.meter .t{display:flex;justify-content:space-between}.meter .t b{color:var(--text);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;transition:width .5s}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.tabs button{padding:8px 11px;border-radius:10px;background:transparent;border-color:transparent;color:var(--mut);white-space:nowrap}
.tabs button:hover{color:var(--text);background:var(--panel2)}
.tabs button.on{background:var(--panel2);border-color:var(--line);color:var(--text)}
.tabs .n{font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px;background:var(--bg);color:var(--mut)}
.tabs .n.crit{background:color-mix(in srgb,var(--crit) 18%,transparent);color:var(--crit)}
.tabs .n.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.filters{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.filters button{padding:5px 12px;border-radius:99px;font-size:12.5px}.filters button.on{border-color:var(--acc);color:var(--acc)}

/* findings */
.fl{display:grid;gap:10px}
.f{display:grid;grid-template-columns:42px 1fr;gap:14px;padding:14px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.f .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.f .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.f .t{font-weight:650;flex:1;min-width:200px}
.f .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.cat{font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.sev{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.f pre{margin:8px 0 0;white-space:pre-wrap;word-break:break-word;color:var(--mut);font-size:12.5px;font-family:inherit}
.fix{margin-top:10px;display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px}
.fix code{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;padding-top:3px}
.f>div{min-width:0}
main>*{min-width:0}
.card{min-width:0}
#tabBody{min-width:0}
.fix button{padding:5px 8px;font-size:12px}
.empty{display:grid;justify-items:center;gap:8px;padding:34px;color:var(--mut)}
.empty svg{width:34px;height:34px;color:var(--ok)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;text-align:left;padding:11px 14px;background:var(--panel2);white-space:nowrap}
td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover td{background:color-mix(in srgb,var(--panel2) 60%,transparent)}
.st{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.gap{height:14px}
.atk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:14px}
.atk div{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}

.scan-ov{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:color-mix(in srgb,var(--bg) 58%,transparent);backdrop-filter:blur(14px) saturate(125%);-webkit-backdrop-filter:blur(14px) saturate(125%);opacity:0;visibility:hidden;transition:opacity .28s ease,visibility .28s}
.scan-ov.on{opacity:1;visibility:visible}
.scan-box{display:grid;justify-items:center;gap:14px;text-align:center;max-width:420px}
.scan-logo{width:min(250px,62vw);height:auto;animation:scanfloat 2.4s ease-in-out infinite;filter:drop-shadow(0 12px 34px color-mix(in srgb,var(--acc) 45%,transparent))}
.scan-t{font-size:24px;font-weight:800;letter-spacing:-.02em}
.scan-h{color:var(--mut);font-size:13.5px}
.scan-bar{width:min(300px,72vw);height:5px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.scan-bar i{display:block;width:42%;height:100%;background:linear-gradient(90deg,transparent,var(--acc),transparent);border-radius:4px;animation:scanslide 1.3s ease-in-out infinite}
.scan-s{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
@keyframes scanfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-9px) scale(1.035)}}
@keyframes scanslide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){.scan-logo,.scan-bar i{animation:none}}
textarea{font:inherit;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;width:100%;min-height:110px;resize:vertical;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;line-height:1.6}
textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.hint{font-weight:400;font-size:12px;color:var(--mut);line-height:1.5}
.ok-note{color:var(--ok);min-height:1.3em;font-size:13px}
dialog.modal{padding:0;border-radius:16px;overflow:hidden;width:min(440px,94vw);max-height:min(92vh,880px);box-shadow:0 24px 80px #000a,var(--shadow)}
dialog.modal.wide{width:min(660px,94vw)}
dialog.modal[open]{display:flex;flex-direction:column}
.mform{display:flex!important;flex-direction:column;min-height:0;flex:1;gap:0!important}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 16px 24px;border-bottom:1px solid var(--line);flex:none}
.mh .x{padding:7px;border:0;background:transparent;color:var(--mut);border-radius:9px}
.mh .x:hover{background:var(--panel2);color:var(--text)}
.mb{display:grid;gap:18px;padding:22px 24px;overflow-y:auto;min-height:0;flex:1;align-content:start}
.mf{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 24px;border-top:1px solid var(--line);background:var(--panel);flex:none}
.mf .err{flex:1;min-height:0;font-size:12.5px}
select{font:inherit;font-weight:400;width:100%;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
select:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=checkbox]{width:auto;accent-color:var(--acc);margin:0}
label.chk{display:flex;align-items:center;gap:10px}
.sect{display:grid;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.sect-t{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.sect label{margin:0}
.lnk{display:inline-flex;align-items:center;gap:6px;color:var(--info);text-decoration:none;font-size:12.5px;font-weight:600;margin-top:8px}
.lnk:hover{text-decoration:underline}
.res-ok{color:var(--ok)}.res-err{color:var(--crit)}
.srcs{display:flex;gap:8px;flex-wrap:wrap}
.nbadge{min-width:18px;height:18px;padding:0 6px;border-radius:99px;font-size:11px;font-weight:800;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.nbadge.crit{background:color-mix(in srgb,var(--crit) 22%,transparent);color:var(--crit)}
.nbadge:empty{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1s linear infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.al-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.al-bar .t{font-weight:650}
.pbar{height:4px;border-radius:4px;background:var(--bg);overflow:hidden;margin-top:10px}
.pbar i{display:block;width:40%;height:100%;background:linear-gradient(90deg,transparent,var(--acc),transparent);animation:scanslide 1.3s ease-in-out infinite}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:24px;width:min(420px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
dialog form{display:grid;gap:18px}
@media(max-width:640px){main{padding:14px}header{padding:10px 14px}header .lbl{display:none}.two{grid-template-columns:1fr}.meters{grid-template-columns:1fr}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>

<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></symbol>
<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
<symbol id="i-pkg" viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="11" rx="2"/><path d="M7 9V5h4v4M13 9V5h4v4M7 14h.01M11 14h.01M15 14h.01"/></symbol>
<symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></symbol>

const errMsg=m=>{if(LANG!=='es')return m;if(ERR_ES[m])return ERR_ES[m];for(const [k,v] of ERR_PFX)if(m.startsWith(k))return v+m.slice(k.length);return m};

function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.querySelectorAll('[data-i18n-title]').forEach(e=>{e.title=t(e.dataset.i18nTitle);e.setAttribute('aria-label',t(e.dataset.i18nTitle))});
  document.querySelectorAll('[data-i18n-html]').forEach(e=>e.innerHTML=t(e.dataset.i18nHtml));
  document.querySelectorAll('[data-lang]').forEach(e=>{e.innerHTML=['en','es'].map(l=>`<button type="button" data-l="${l}" class="${l===LANG?'on':''}">${l.toUpperCase()}</button>`).join('')});
  $('#scanLbl').textContent=SCANNING?t('scanning'):t('scanNow');
  document.querySelectorAll('.pw .eye').forEach(b=>b.title=t(b.dataset.on==='1'?'hidePass':'showPass'));
  if(LAST_M)renderMetrics(LAST_M);renderReport();syncOverlay();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-l]');if(!b)return;LANG=b.dataset.l;try{localStorage.setItem('dd_lang',LANG)}catch{}applyLang();if(!$('#app').classList.contains('hidden'))pollReport().catch(()=>{})});

/* ---------------- helpers ---------------- */
const api=async(path,body)=>{const r=await fetch('/api/'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch{} if(r.status===401&&path!=='login'&&path!=='setup'&&path!=='account'){showLogin();throw 0} if(!r.ok)throw new Error(errMsg(j.error||'error'));return j};
const bytes=n=>{const u=['B','KB','MB','GB','TB'];let i=0;n=+n||0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+' '+u[i]};
const dur=s=>{s=Math.floor(s);const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+'d ':'')+h+'h '+m+'m'};
const col=p=>p>=90?'var(--crit)':p>=75?'var(--warn)':'var(--ok)';
const dot=k=>`<span class="dot ${k}"></span>`;
const SEVK={crit:'crit',warn:'warn',info:'info',ok:'ok'};
const CATICON={Versions:'layers',Ports:'globe',Services:'server',SSL:'lock',Permissions:'key',Dependencies:'pkg',Docker:'box',Security:'shield',Resources:'gauge',Advisories:'bell'};
let INTEL=null,MANUAL=false,SCAN_T0=0,SCAN_TMR=null,POLL_T=null,timers=[],tab='findings',sevF='all',REP=null,SCANNING=false,LAST_M=null;

function spark(arr,color,max){arr=arr||[];if(arr.length<2)return'<svg class="spark"></svg>';
  const m=max||Math.max(...arr,1),w=300,h=44,st=w/(arr.length-1);
  const pts=arr.map((v,i)=>(i*st).toFixed(1)+','+(h-2-(v/m)*(h-6)).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${h} ${pts} ${w},${h}" fill="${color}" opacity=".14"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`}
function donut(p){const r=30,c=2*Math.PI*r,k=col(p);return `<svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--bg)" stroke-width="8"/><circle cx="38" cy="38" r="${r}" fill="none" stroke="${k}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*Math.min(p,100)/100} ${c}" transform="rotate(-90 38 38)"/><text x="38" y="44" text-anchor="middle">${Math.round(p)}%</text></svg>`}

/* ---------------- screens ---------------- */
function hideAll(){['#login','#setup','#app'].forEach(s=>$(s).classList.add('hidden'))}
function showLogin(){timers.forEach(clearInterval);timers=[];hideAll();$('#login').classList.remove('hidden');$('#lu').focus()}
async function showApp(){hideAll();$('#app').classList.remove('hidden');
  await Promise.all([pollMetrics(),pollReport()]);
  timers.push(setInterval(()=>pollMetrics().catch(()=>{}),2000),setInterval(()=>pollReport().catch(()=>{}),SCANNING?2000:10000))}

async function pollMetrics(){const m=await api('metrics');LAST_M=m;renderMetrics(m)}
async function pollReport(){const j=await api('report?lang='+LANG);const was=SCANNING;SCANNING=j.running;REP=j.report;INTEL=j.intel||null;
  $('#scanBtn').disabled=SCANNING;$('#scanLbl').textContent=SCANNING?t('scanning'):t('scanNow');
  renderReport();renderAlerts();syncOverlay();clearTimeout(POLL_T);if(SCANNING||(INTEL&&INTEL.running))POLL_T=setTimeout(()=>pollReport().catch(()=>{}),1500)}

function renderAlerts(){
  const I=INTEL||{enabled:true,running:false,sources:[],counts:{},findings:[]};
  const n=(I.counts.crit||0)+(I.counts.warn||0),nb=$('#alertN');
  nb.textContent=n||'';nb.className='nbadge'+(I.counts.crit?' crit':'');
  $('#alertBtn').title=t('alertsBtn');
  const box=$('#alBody');if(!box)return;
  if(!$('#alerts').open)return;
  if(!I.enabled){box.innerHTML='<div class="empty muted">'+ic('bell')+'<div>'+t('intelOff')+'</div><button type="button" data-open-settings>'+ic('gear','sm')+t('configure')+'</button></div>';return}
  const when=I.checked_at?t('lastCheck')+': '+new Date(I.checked_at).toLocaleString(LANG):t('neverChecked');
  const btn='<button type="button" class="pri" id="alCheck"'+(I.running?' disabled':'')+'>'+ic('scan','sm'+(I.running?' spin':''))+(I.running?t('checking'):t('checkNow'))+'</button>';
  const srcs=(I.sources||[]).length?'<div><div class="muted" style="margin-bottom:8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700">'+t('sources')+'</div><div class="srcs">'+I.sources.map(s=>{const k=!s.ok?'crit':s.error?'warn':'ok';return '<span class="tag" title="'+esc((s.error?s.error+' · ':'')+new Date(s.at).toLocaleString(LANG)+(s.cached?' · '+t('cachedData'):''))+'">'+dot(k)+esc(s.name)+'</span>'}).join('')+'</div></div>':'';
  box.innerHTML='<div class="al-bar"><div><div class="t">'+esc(when)+'</div><div class="hint">'+t('autoDaily')+'</div></div>'+btn+(I.running?'<div class="pbar" style="flex-basis:100%"><i></i></div>':'')+'</div>'+srcs+(I.findings.length?findings(I.findings):'<div class="empty">'+ic('okc')+'<div>'+(I.checked_at?t('alertsNone'):t('neverChecked'))+'</div></div>');
}
function syncOverlay(){
  const on=SCANNING&&(MANUAL||!REP),ov=$('#scanOv');
  if(!SCANNING)MANUAL=false;
  ov.classList.toggle('on',on);ov.setAttribute('aria-hidden',on?'false':'true');
  document.body.style.overflow=on?'hidden':'';
  $('#scanT').textContent=t('scanning');$('#scanH').textContent=t('scanHint');
  if(on&&!SCAN_TMR){SCAN_T0=Date.now();const tick=()=>{$('#scanS').textContent=Math.floor((Date.now()-SCAN_T0)/1000)+' s'};tick();SCAN_TMR=setInterval(tick,1000)}
  if(!on&&SCAN_TMR){clearInterval(SCAN_TMR);SCAN_TMR=null}
}
function procColor(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 45%)`}

function renderMetrics(m){
  const memP=m.mem_total?m.mem_used/m.mem_total*100:0,swP=m.swap_total?m.swap_used/m.swap_total*100:0,H=m.history||{};
  $('#sysTags').innerHTML=[
    `<span class="tag">${ic('server','sm')}${esc(m.host)}</span>`,
    `<span class="tag">${ic('term','sm')}${esc(m.os)}</span>`,
    `<span class="tag mono">${ic('tag','sm')}kernel ${esc(m.kernel)}</span>`,
    `<span class="tag">${ic('cpu','sm')}${m.cores} ${t('cores')}</span>`,
    ...(m.ips||[]).slice(0,3).map(ip=>`<span class="tag mono">${ic('globe','sm')}${esc(ip)}</span>`),...((m.ips||[]).length>3?[`<span class="tag" title="${esc((m.ips||[]).slice(3).join(', '))}">+${m.ips.length-3}</span>`]:[])].join('');
  const st=(arr)=>'<div class="stats">'+arr.filter(Boolean).map(x=>'<span>'+x+'</span>').join('')+'</div>';
  const kv=(l,v,c)=>l+' <b'+(c?' style="color:'+c+'"':'')+'>'+v+'</b>';
  const cb=m.cpu_break||{},tk=m.tasks||{},cn=m.conns||{};
  const dsum=(H.disk_r||[]).map((v,i)=>v+((H.disk_w||[])[i]||0));
  const card=(ico,title,v,sub,extra,sp)=>'<div class="card kpi"><div class="hd">'+ic(ico,'sm')+title+'</div><div class="v">'+v+'</div><div class="s">'+sub+'</div>'+(extra||'')+(sp||'')+'</div>';
  const cards=[
   card('cpu',t('cpu'),'<span style="color:'+col(m.cpu)+'">'+m.cpu.toFixed(1)+'%</span>',esc(m.cpu_model||'')+' · '+m.cores+' '+t('cores'),
     st([kv(t('user'),(cb.user||0).toFixed(1)+'%'),kv(t('sys'),(cb.system||0).toFixed(1)+'%'),kv(t('iowait'),(cb.iowait||0).toFixed(1)+'%',(cb.iowait||0)>10?'var(--warn)':''),kv(t('steal'),(cb.steal||0).toFixed(1)+'%',(cb.steal||0)>5?'var(--crit)':'')]),spark(H.cpu,col(m.cpu),100)),
   card('mem',t('memory'),'<span style="color:'+col(memP)+'">'+memP.toFixed(0)+'%</span>',bytes(m.mem_used)+' '+t('of')+' '+bytes(m.mem_total),
     st([kv(t('cached'),bytes(m.mem_cached)),kv(t('avail'),bytes(m.mem_avail)),kv(t('swap'),m.swap_total?swP.toFixed(0)+'% / '+bytes(m.swap_total):t('noSwap'),swP>50?'var(--warn)':'')]),spark(H.mem,col(memP),100)),
   card('net',t('network'),ic('down','sm')+' '+bytes(m.rx)+'/s',ic('up','sm')+' '+bytes(m.tx)+'/s',
     st([kv('pkts/s',Math.round(m.rx_pkts||0)+' / '+Math.round(m.tx_pkts||0)),kv(t('errors'),m.net_errs||0,(m.net_errs||0)>0?'var(--warn)':'')]),spark(H.rx,'var(--info)')),
   card('disk',t('diskIO'),ic('down','sm')+' '+bytes(m.disk_read||0)+'/s',ic('up','sm')+' '+bytes(m.disk_write||0)+'/s',
     st([kv('IOPS',Math.round(m.disk_iops||0))]),spark(dsum,'var(--acc)')),
   card('act',t('load'),m.load.map(x=>x.toFixed(2)).join(' '),t('perCore')+': '+(m.cores?(m.load[0]/m.cores).toFixed(2):'-'),
     st([kv(t('zombies'),m.zombies,m.zombies>5?'var(--warn)':'')])),
   card('clock',t('uptime'),dur(m.uptime_sec),t('booted')+' '+new Date(Date.now()-m.uptime_sec*1000).toLocaleString(LANG)),
   card('globe',t('conns'),cn.established??0,t('established'),st([kv('time-wait',cn.time_wait??0),kv(t('listening'),cn.listen??0)])),
   card('layers',t('procsT'),tk.processes??0,(tk.threads??0)+' '+t('threads'),st([kv(t('running'),tk.running??0)]))
  ];
  if(m.temp_c>0)cards.push(card('gauge',t('temp'),'<span style="color:'+(m.temp_c>=85?'var(--crit)':m.temp_c>=70?'var(--warn)':'var(--ok)')+'">'+m.temp_c.toFixed(0)+' °C</span>',t('hottest')));
  const n=cards.length;$('#kpis').style.setProperty('--cols',n===9?3:n%4===0?4:n%3===0?3:4); // filas completas
  $('#kpis').innerHTML=cards.join('');
  const dn=(m.disks||[]).length;$('#disks').style.setProperty('--dcols',dn<=4?Math.max(dn,1):dn===5?5:dn%4===0?4:dn%3===0?3:4);
  $('#disks').innerHTML=(m.disks||[]).map(d=>`<div class="disk">${donut(d.pct)}<div class="dt"><div class="m mono" title="${esc(d.mount)}">${esc(d.mount)}</div><div class="u">${bytes(d.used)} / ${bytes(d.total)} · ${esc(d.type)}</div><div class="u">${bytes(d.total-d.used)} ${t('free')}${d.inode_pct>=70?` · <span class="warn">${t('inodes')} ${d.inode_pct}%</span>`:''}</div></div></div>`).join('')||`<span class="muted">${t('nothing')}</span>`;
  $('#procSum').innerHTML=(m.procs||[]).slice(0,3).map(p=>`<span class="tag">${esc(p.cmd)} <b style="color:${col(p.cpu)}">${p.cpu}%</b></span>`).join('');
  $('#procs').innerHTML=(m.procs||[]).map(p=>`<div class="proc"><div class="av" style="background:${procColor(p.cmd)}">${esc((p.cmd[0]||'?').toUpperCase())}</div><div style="min-width:0"><div class="nm"><b>${esc(p.cmd)}</b><span class="mini mono">PID ${p.pid}</span><span class="mini">${esc(p.user)}</span></div>
    <div class="meters"><div class="meter"><div class="t"><span>CPU</span><b>${p.cpu}%</b></div><div class="bar"><i style="width:${Math.min(p.cpu,100)}%;background:${col(p.cpu)}"></i></div></div>
    <div class="meter"><div class="t"><span>MEM</span><b>${p.mem}%</b></div><div class="bar"><i style="width:${Math.min(p.mem*3,100)}%;background:var(--info)"></i></div></div></div></div></div>`).join('');
}

function ring(score){const c=2*Math.PI*42,k=score>=80?'var(--ok)':score>=55?'var(--warn)':'var(--crit)';
  $('#ring').innerHTML=`<circle cx="50" cy="50" r="42" fill="none" stroke="var(--panel2)" stroke-width="9"/><circle cx="50" cy="50" r="42" fill="none" stroke="${k}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${c*score/100} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="58" text-anchor="middle">${score}</text>`}

function renderReport(){
  const r=REP;
  if(!r){ring(0);$('#scoreTxt').textContent=t('noScanYet');$('#pills').innerHTML='';renderTabs();return}
  ring(r.score);
  $('#scoreTxt').textContent=`${t('lastScan')}: ${new Date(r.started).toLocaleString(LANG)} · ${(r.duration_ms/1000).toFixed(1)}s`;
  $('#pills').innerHTML=[['crit','critical'],['warn','warning'],['info','infoN']].map(([k,l])=>`<span class="pill ${k}">${dot(k)}${r.counts[k]||0} ${t(l)}</span>`).join('');
  renderTabs();
}

const TABS=[['findings','list','tFindings',null],['ports','globe','tPorts',['Ports']],['services','server','tServices',['Services']],['ssl','lock','tSsl',['SSL']],['versions','layers','tVersions',['Versions']],
 ['projects','pkg','tProjects',['Dependencies']],['containers','box','tContainers',['Docker']],['security','shield','tSecurity',['Security','Permissions','Resources']]];

function badge(cats,r){const fs=(r.findings||[]).filter(f=>!cats||cats.includes(f.category));const c=fs.filter(f=>f.severity==='crit').length,w=fs.filter(f=>f.severity==='warn').length;
  const n=c+w;return n?`<span class="n ${c?'crit':'warn'}">${n}</span>`:''}

function findings(list){
  if(!list.length)return`<div class="empty">${ic('okc')}<div>${t('noFindings')}</div></div>`;
  return`<div class="fl">`+list.map((f,i)=>`<div class="f"><div class="ic">${ic(CATICON[f.category]||'shield')}</div><div>
    <div class="meta"><span class="sev ${f.severity}">${dot(f.severity)}${t(f.severity)}</span><span class="cat">${esc(t('c_'+f.category))}</span></div>
    <div class="t">${esc(f.title)}</div>${f.detail?`<pre>${esc(f.detail)}</pre>`:''}
    ${f.link&&/^https:\/\//.test(f.link)?`<a class="lnk" href="${esc(f.link)}" target="_blank" rel="noopener noreferrer">${ic('link','sm')}${t('details')}</a>`:''}
    ${f.fix?`<div class="fix"><code>${esc(f.fix)}</code><button type="button" data-copy="${esc(f.fix)}" title="${t('copy')}">${ic('copy','sm')}</button></div>`:''}</div></div>`).join('')+`</div>`;
}
const tbl=(head,rows)=>rows.length?`<div class="tw"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty muted">${t('nothing')}</div>`;

function renderTabs(){
  const r=REP||{};
  $('#tabs').innerHTML=TABS.map(([id,icon,label,cats])=>`<button data-t="${id}" class="${id===tab?'on':''}">${ic(icon,'sm')}${t(label)}${badge(cats,r)}</button>`).join('');
  const F=r.findings||[],cat=c=>F.filter(f=>c.includes(f.category));let h='';
  if(tab==='findings')h=`<div class="filters">${['all','crit','warn','info'].map(k=>`<button data-s="${k}" class="${sevF===k?'on':''}">${k!=='all'?dot(k):''}${t(k)}</button>`).join('')}</div>`+findings(F.filter(f=>sevF==='all'||f.severity===sevF));
  else if(tab==='ports')h=tbl([t('port'),t('proto'),t('listen'),t('process'),t('state')],(r.ports||[]).map(p=>`<tr><td><b>${p.port}</b></td><td>${esc(p.proto)}</td><td class="mono">${esc(p.addr)}</td><td>${esc(p.process||'-')}${p.pid?` <span class="muted">(${p.pid})</span>`:''}</td><td>${p.note?`<span class="st crit">${dot('crit')}${esc(p.note)}</span>`:p.exposed?`<span class="st warn">${dot('warn')}${t('publicP')}</span>`:`<span class="st ok">${dot('ok')}${t('localP')}</span>`}</td></tr>`))+'<div class="gap"></div>'+findings(cat(['Ports']));
  else if(tab==='services')h=tbl([t('service'),t('status'),t('boot')],(r.services||[]).map(s=>{const k=s.active==='active'?'ok':s.enabled==='enabled'?'crit':'mut';return`<tr><td><b>${esc(s.name)}</b></td><td><span class="st ${k}">${dot(k)}${esc(s.active)}</span></td><td class="muted">${esc(s.enabled)}</td></tr>`}))+'<div class="gap"></div>'+findings(cat(['Services']));
  else if(tab==='ssl')h=tbl([t('domains'),t('issuer'),t('expires'),t('days'),t('path')],(r.certs||[]).map(c=>{const k=c.days_left<=14?'crit':c.days_left<=30?'warn':'ok';return`<tr><td>${esc(c.dns&&c.dns.length?c.dns.join(', '):c.subject)}${c.self_signed?` <span class="tag" style="padding:1px 8px">${t('selfSigned')}</span>`:''}</td><td>${esc(c.issuer)}</td><td>${new Date(c.not_after).toLocaleDateString(LANG)}</td><td><span class="st ${k}">${dot(k)}${c.days_left}</span></td><td class="mono muted">${esc(c.path)}</td></tr>`}))+'<div class="gap"></div>'+findings(cat(['SSL']).filter(f=>!/expire|EXPIRED|expira|EXPIRADO/.test(f.title)));
  else if(tab==='versions')h=tbl([t('software'),t('version'),t('status')],(r.versions||[]).map(v=>`<tr><td><b>${esc(v.name)}</b></td><td class="mono">${esc(v.version)}</td><td><span class="st ${v.status}">${dot(v.status)}${esc(v.note||'OK')}</span></td></tr>`));
  else if(tab==='projects')h=(!(r.projects||[]).length?`<div class="empty">${ic('pkg')}<div>${t('noProjects')}</div><div class="row" style="justify-content:center">${(r.scan_roots||[]).map(p=>`<span class="tag mono">${esc(p)}</span>`).join('')||`<span class="muted">${t('noRoots')}</span>`}</div><div class="muted" style="max-width:560px">${t('addRootsHelp')}</div><button type="button" data-open-settings>${ic('gear','sm')}${t('configure')}</button></div>`:'')+tbl([t('project'),t('type'),t('requires'),t('vulns'),t('issues')],(r.projects||[]).map(p=>`<tr><td class="mono">${esc(p.path)}</td><td>${esc(p.framework||'-')}</td><td class="mono">${esc([p.php_req&&'php '+p.php_req,p.node_req&&'node '+p.node_req].filter(Boolean).join(' · ')||'-')}</td><td>${p.vulns?Object.entries(p.vulns).filter(([k])=>k==='composer'||k==='npm').map(([k,v])=>`<span class="st ${v?'crit':'ok'}">${dot(v?'crit':'ok')}${k}: ${v}</span>`).join(' &nbsp; '):`<span class="muted">${t('notAudited')}</span>`}</td><td><span class="st ${p.issues?'warn':'ok'}">${dot(p.issues?'warn':'ok')}${p.issues}</span></td></tr>`))+'<div class="gap"></div>'+findings(cat(['Dependencies']));
  else if(tab==='containers')h=tbl([t('container'),t('image'),t('state'),t('inside'),t('cpuRam'),t('cves'),t('ports')],(r.containers||[]).map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted">${esc(c.user)}${c.restarts?' · '+c.restarts+' '+t('restarts'):''}</div></td><td class="mono">${esc(c.image)}<div class="muted">${c.age_days?c.age_days+' '+t('daysOld'):''}</div></td><td><span class="st ${c.state==='running'?'ok':'crit'}">${dot(c.state==='running'?'ok':'crit')}${esc(c.state)}</span></td><td>${(c.versions||[]).map(v=>`<span class="st ${v.status}">${dot(v.status)}${esc(v.name+' '+v.version)}</span>`).join('<br>')||'<span class="muted">-</span>'}</td><td class="mono">${esc(c.cpu||'-')}<div class="muted">${esc(c.mem||'')}</div></td><td>${c.vulns?`<span class="st ${c.vulns.critical?'crit':c.vulns.high?'warn':'ok'}">${dot(c.vulns.critical?'crit':c.vulns.high?'warn':'ok')}${c.vulns.critical||0} / ${c.vulns.high||0}</span>`:`<span class="muted">${t('notScanned')}</span>`}</td><td class="mono">${esc((c.ports||[]).join(', ')||'-')}</td></tr>`))+'<div class="gap"></div>'+findings(cat(['Docker']));
  else if(tab==='security')h=(r.attackers&&r.attackers.length?`<h2>${ic('shield','sm')}${t('attempts')}</h2><div class="atk">${r.attackers.map(a=>`<div><span class="mono">${esc(a.ip)}</span><b>${a.count}</b></div>`).join('')}</div>`:'')+findings(cat(['Security','Permissions','Resources']));
  $('#tabBody').innerHTML=h;
}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;renderTabs()}};
$('#tabBody').onclick=e=>{
  const s=e.target.closest('[data-s]');if(s){sevF=s.dataset.s;renderTabs();return}
  const c=e.target.closest('[data-copy]');if(c){const txt=c.dataset.copy;const done=()=>{c.innerHTML=ic('check','sm');setTimeout(()=>c.innerHTML=ic('copy','sm'),1200)};
    if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(done,()=>{});else{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch{}ta.remove()}}};

/* ---------------- forms ---------------- */
$('#lf').onsubmit=async e=>{e.preventDefault();$('#le').textContent='';
  try{await api('login',{username:$('#lu').value,password:$('#lp').value});$('#lp').value='';await showApp()}catch(x){$('#le').textContent=x.message||''}};
$('#sf').onsubmit=async e=>{e.preventDefault();$('#se').textContent='';
  if($('#sp').value!==$('#sr').value){$('#se').textContent=t('passMismatch');return}
  try{await api('setup',{token:$('#st').value.trim(),username:$('#su').value,password:$('#sp').value});['#st','#sp','#sr'].forEach(s=>$(s).value='');await showApp()}catch(x){$('#se').textContent=x.message||''}};
$('#outBtn').onclick=async()=>{await api('logout',{}).catch(()=>{});showLogin()};
$('#scanBtn').onclick=async()=>{MANUAL=true;SCANNING=true;syncOverlay();try{await api('scan',{})}catch(x){}await pollReport()};
const CLR={tg:false,sl:false};
function stateLine(){
  const L=(id,set,key)=>{const el=$(id);if(!el)return;el.innerHTML=set?(CLR[key]?esc(t('willRemove')):esc(t('savedKeep'))+' <a href="#" data-clear="'+key+'" class="lnk" style="margin:0">'+t('remove')+'</a>'):''};
  L('#nTgState',SET.tg,'tg');L('#nSlState',SET.sl,'sl');
}
const SET={tg:false,sl:false};
document.addEventListener('click',e=>{const a=e.target.closest('[data-clear]');if(!a)return;e.preventDefault();CLR[a.dataset.clear]=true;stateLine()});
function notifyPayload(){return{telegram_token:$('#nTgTok').value,telegram_clear:CLR.tg,telegram_chat_id:$('#nTgChat').value,slack_webhook:$('#nSlack').value,slack_clear:CLR.sl,min_severity:$('#nSev').value,lang:LANG,recovery:$('#nRec').checked}}
$('#nTest').onclick=async()=>{const el=$('#nRes');el.className='hint';el.textContent='...';
  try{const j=await api('notify/test',{notify:notifyPayload()});el.innerHTML=(j.results||[]).map(r=>r.ok?'<span class="res-ok">'+esc(r.channel)+': '+t('testOk')+'</span>':'<span class="res-err">'+esc(r.channel)+': '+esc(r.error)+'</span>').join(' &nbsp; ')}catch(x){if(x){el.className='hint res-err';el.textContent=x.message||''}}};
async function openSettings(){$('#sErr').textContent='';try{const s=await api('settings');$('#sRoots').value=(s.scan_roots||[]).join('\n');$('#sIntel').checked=s.intel_enabled!==false;const n=s.notify||{};CLR.tg=false;CLR.sl=false;SET.tg=!!n.telegram_token_set;SET.sl=!!n.slack_webhook_set;$('#nTgTok').value='';$('#nSlack').value='';$('#nTgChat').value=n.telegram_chat_id||'';$('#nSev').value=n.min_severity||'crit';$('#nRec').checked=!!n.recovery;$('#nRes').textContent='';stateLine()}catch(x){if(x)$('#sErr').textContent=x.message||''}$('#settings').showModal()}
$('#setBtn').onclick=openSettings;
$('#alertBtn').onclick=()=>{$('#alerts').showModal();renderAlerts();if(document.activeElement)document.activeElement.blur()};
$('#alx').onclick=()=>$('#alerts').close();
document.addEventListener('click',async e=>{if(!e.target.closest('#alCheck'))return;
  try{await api('intel/scan',{});if(INTEL)INTEL.running=true;renderAlerts();await pollReport()}catch(x){}});
$('#sx').onclick=$('#sxx').onclick=()=>$('#settings').close();
for(const d of document.querySelectorAll('dialog.modal'))d.addEventListener('mousedown',e=>{if(e.target===d)d.close()});
document.addEventListener('click',e=>{if(e.target.closest('[data-open-settings]'))openSettings()});
$('#setf').onsubmit=async e=>{e.preventDefault();$('#sErr').textContent='';
  const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);
  try{await api('settings',{scan_roots:lines($('#sRoots').value),intel_enabled:$('#sIntel').checked,notify:notifyPayload()});$('#settings').close();MANUAL=true;SCANNING=true;syncOverlay();await pollReport()}catch(x){if(x)$('#sErr').textContent=x.message||''}};
$('#acctBtn').onclick=()=>{$('#ae').textContent='';$('#acct').showModal()};
$('#ax').onclick=$('#axx').onclick=()=>$('#acct').close();
$('#af').onsubmit=async e=>{e.preventDefault();$('#ae').textContent='';
  try{await api('account',{current:$('#ac').value,username:$('#au').value,password:$('#an').value});$('#acct').close();['#ac','#au','#an'].forEach(s=>$(s).value='');alert(t('acctUpdated'));showLogin()}catch(x){$('#ae').textContent=x.message||''}};

(function(){const pb=$('#procBox');try{pb.open=localStorage.getItem('dd_procs_open')==='1'}catch{}pb.addEventListener('toggle',()=>{try{localStorage.setItem('dd_procs_open',pb.open?'1':'0')}catch{}})})();
applyLang();
(async()=>{try{const s=await(await fetch('/api/status')).json();if(s.setup){hideAll();$('#setup').classList.remove('hidden');$('#st').focus();return}}catch{}
  api('me').then(showApp).catch(()=>showLogin())})();
</script>
</body>
</html>
